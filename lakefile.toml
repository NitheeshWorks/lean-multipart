name = "LeanMultipart"
version = "0.1.0"
defaultTargets = ["LeanMultipart", "props", "conformance"]

# The verified library. Everything under LeanMultipart/ except Transport.lean is a
# total function and the proof surface; see CONTRIBUTING.md.
[[lean_lib]]
name = "LeanMultipart"

# Property tests for what is tested rather than proved. No dependencies, runs
# in well under a second: `lake exe props [seed]`.
[[lean_exe]]
name = "props"
root = "tests.Props"

# Conformance cases re-expressed from the upstream test suite:
# `lake exe conformance`. Each case names the upstream test it mirrors.
[[lean_exe]]
name = "conformance"
root = "tests.Conformance"

# The upstream HTTP fixtures, as data for the conformance runner.
[[lean_lib]]
name = "Fixtures"
roots = ["tests.Fixtures"]
