name = "LeanMultipart"
version = "0.1.0"
defaultTargets = ["LeanMultipart", "props", "conformance", "docs-index"]

# The verified library. Everything under LeanMultipart/ except Transport.lean is a
# total function and the proof surface; see CONTRIBUTING.md.
[[lean_lib]]
name = "LeanMultipart"

# Property tests for what is tested rather than proved. No dependencies, runs
# in well under a second: `lake exe props [seed]`.
[[lean_exe]]
name = "props"
root = "tests.Props"

# Conformance cases re-expressed from the upstream test suite:
# `lake exe conformance`. Each case names the upstream test it mirrors.
[[lean_exe]]
name = "conformance"
root = "tests.Conformance"

# The upstream HTTP fixtures, as data for the conformance runner.
[[lean_lib]]
name = "Fixtures"
roots = ["tests.Fixtures"]

# Helpers the ported examples use in place of Python's standard library
# (`hashlib`, `wsgiref`); see examples/MANIFEST.toml.
[[lean_lib]]
name = "ExampleSupport"
roots = ["examples.support.Hashlib", "examples.support.Wsgiref"]

# python-multipart's docs/index.md, ported block by block:
# `lake exe docs-index` replays the documented curl requests;
# `lake exe docs-index serve <block>` serves the block on port 8123.
[[lean_exe]]
name = "docs-index"
root = "examples.docs.Index"

# The verification gate, compiled: `lake exe axioms LeanMultipart`. A
# byte-for-byte copy of stack-tools/Axioms.lean, pinned by scripts/Axioms.sha256.
[[lean_exe]]
name = "axioms"
root = "scripts.Axioms"
supportInterpreter = true

# Native time and memory checks: `scripts/bench.sh`.
[[lean_exe]]
name = "bench"
root = "tests.Bench"
