# python-multipart ships no example programs; its examples are the Python
# code blocks of its docs pages. Of README.md, docs/index.md, docs/api.md and
# docs/changelog.md, only docs/index.md has any (three). Each block is ported,
# in order, into one Lean file for the page.

[meta]
upstream = "python-multipart"
doc_pages = ["docs/index.md"]
# Stand-ins for the Python standard library the examples use (hashlib, wsgiref).
helpers = ["examples/support/Hashlib.lean", "examples/support/Wsgiref.lean"]

[[example]]
upstream = "docs/index.md#block-1"
title = "Quickstart: Simple Example (parse_form in a WSGI app)"
lean = "examples/docs/Index.lean"
status = "ported"
output = "tests/Conformance.lean::example docs/index.md output matches upstream"

[[example]]
upstream = "docs/index.md#block-2"
title = "In-Depth Example: the starting WSGI app"
lean = "examples/docs/Index.lean"
status = "ported"
output = "tests/Conformance.lean::example docs/index.md output matches upstream"

[[example]]
upstream = "docs/index.md#block-3"
title = "In-Depth Example: the final code (MultipartParser with SHA-256 per part)"
lean = "examples/docs/Index.lean"
status = "ported"
output = "tests/Conformance.lean::example docs/index.md output matches upstream"
