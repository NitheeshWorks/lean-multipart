theorem = ["LeanMultipart.Starlette.urlencoded_bounded", "LeanMultipart.Starlette.multipart_bounded", "LeanMultipart.Machine.feedAUntil_eq"]
test = ["tests/Conformance.lean::starlette urlencoded stops at the first excess", "tests/Conformance.lean::starlette multipart: the first limit crossed is reported", "scripts/bench.sh"]

[[requirement]]
id = "options.max-length"
upstream = "python_multipart/multipart.py parse_options_header"
title = "parse_options_header input bounded at 16 KiB"
status = "deviation"
realises = ["LeanMultipart.Options.parseB", "LeanMultipart.Options.maxLength"]
test = ["scripts/bench.sh"]
note = "Upstream parses any length; values over 16 KiB give no parameters, bounding memory and time."

[[requirement]]
id = "perf.linear"
upstream = "review finding (quadratic streaming, stack depth)"
title = "Linear time and constant stack on large inputs"
status = "tested"
realises = ["LeanMultipart.QuerystringParser.write", "LeanMultipart.percentDecode", "LeanMultipart.Mp.dataBulk", "LeanMultipart.bytesFoldRun"]
theorem = ["LeanMultipart.bytesFoldRun_eq", "LeanMultipart.Mp.dataBulk_eq", "LeanMultipart.MultipartParser.foldChunk_eq"]
test = ["tests/Props.lean::bigChecks", "tests/Bench.lean::bounds", "scripts/bench.sh"]
note = "Time and peak memory are checked natively on 50 MB bodies in CI, not proved."

[[requirement]]
id = "io.objects"
upstream = "python_multipart/multipart.py parse_form, MultipartParser.__init__ / write (raising objects over a stream)"
title = "parse_form over an input stream and MultipartParser as a raising IO object, as the docs examples use them"
status = "tested"
realises = ["LeanMultipart.parseFormStream", "LeanMultipart.MultipartParser.create", "LeanMultipart.MultipartParser.Object.write"]
test = ["tests/Conformance.lean::example docs/index.md output matches upstream"]
note = "Thin IO loops over the pure parsers; the examples in examples/docs/Index.lean exercise them against upstream's output."
