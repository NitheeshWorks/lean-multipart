title = "; is data, not a separator"
status = "implemented"
realises = ["LeanMultipart.Qs.step"]
test = ["tests/Conformance.lean::querystring semicolon is data"]

[[requirement]]
id = "qs.blank-segments"
upstream = "tests/test_multipart.py::TestQuerystringParser::test_querystring_blank_beginning"
title = "Empty segments skipped; bare names have empty value"
status = "implemented"
realises = ["LeanMultipart.Qs.step", "LeanMultipart.Qs.finish"]
test = ["tests/Conformance.lean::querystring blank beginning", "tests/Conformance.lean::querystring trailing bare name"]

[[requirement]]
id = "qs.strict"
upstream = "tests/test_multipart.py::TestQuerystringParser::test_strict_parsing_fail_double_sep"
title = "Strict mode: duplicate & and missing = are errors"
status = "implemented"
realises = ["LeanMultipart.Qs.step", "LeanMultipart.QsErrorKind"]
test = ["tests/Conformance.lean::querystring strict double separator (all splits)", "tests/Conformance.lean::querystring strict no value"]

[[requirement]]
id = "qs.max-size"
