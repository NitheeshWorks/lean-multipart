realises = ["LeanMultipart.Boundary", "LeanMultipart.ValidBoundary", "LeanMultipart.API.parseBoundary"]
theorem = ["LeanMultipart.API.parseBoundary_valid"]
test = ["tests/Conformance.lean::boundary length 256 / 257"]
note = "Upstream accepts any byte; only bchars are accepted here (a CR would break the delimiter search). Length bound is upstream's 256, not RFC 2046's 70."

[[requirement]]
id = "multipart.roundtrip"
upstream = "tests/test_multipart.py::TestFormParser::test_http"
title = "Multipart print/parse round trip on any epilogue"
status = "implemented"
