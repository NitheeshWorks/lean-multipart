theorem = ["LeanMultipart.QuerystringParser.parseChunks_eq"]
test = ["tests/Conformance.lean::querystring streaming break", "tests/Props.lean::smoke QuerystringParser.parseChunks_eq"]

[[requirement]]
id = "qs.error-offsets"
upstream = "tests/test_multipart.py::TestQuerystringParser::test_strict_parsing_fail_double_sep"
title = "Error offsets: chunk-relative offset plus absolute error.offset"
status = "deviation"
realises = ["LeanMultipart.QuerystringParseError", "LeanMultipart.MultipartParseError"]
test = ["tests/Conformance.lean::querystring strict double separator (all splits)"]
note = "Upstream reports only the chunk-relative offset; the absolute one is also given."

