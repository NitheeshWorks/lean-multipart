# Traceability register: upstream behaviour -> Lean symbol -> theorem -> test.
#
# `scripts/traceability-check.py` validates it on every CI run: every
# `realises`/`theorem` symbol must resolve, every `test` path must exist.
#
# status: implemented | partial | tested | excluded | deviation
#   implemented  realised and proved
#   partial      realised, proof incomplete or covering a subset
#   tested       realised, deliberately tested rather than proved (say why)
#   excluded     out of scope, rejected by name
#   deviation    behaviour differs from upstream on purpose (say how)

[meta]
upstream_name = "python-multipart"
upstream_url = "https://github.com/Kludex/python-multipart"
upstream_commit = "51ff1a438146bc67740908c6e69df919c09cf7ca"
upstream_license = "Apache-2.0"

[[requirement]]
id = "percent.roundtrip"
upstream = "urllib.parse.quote / unquote_to_bytes (used by Starlette's FormParser)"
title = "Percent-encoding round trip on any continuation"
status = "implemented"
realises = ["LeanMultipart.percentEncode", "LeanMultipart.percentDecode", "LeanMultipart.API.percentEncode"]
theorem = ["LeanMultipart.percentDecode_percentEncode_extB", "LeanMultipart.percentDecode_percentEncode_ext"]
test = ["tests/Props.lean::smoke percentDecode_percentEncode"]

[[requirement]]
id = "percent.quote-plus"
upstream = "urllib.parse.quote_plus / unquote_plus"
title = "quote_plus round trip, + as space"
status = "implemented"
realises = ["LeanMultipart.quotePlus", "LeanMultipart.unquotePlus"]
theorem = ["LeanMultipart.unquotePlus_quotePlus_extB"]
test = ["tests/Props.lean::smoke unquotePlus_quotePlus"]

[[requirement]]
id = "urlencoded.roundtrip"
upstream = "urllib.parse.urlencode / Starlette FormParser"
title = "Urlencoded print/parse round trip, plain and _ext"
status = "implemented"
realises = ["LeanMultipart.urlencodeB", "LeanMultipart.urldecodeB", "LeanMultipart.API.urlencode"]
theorem = ["LeanMultipart.urldecodeB_urlencodeB", "LeanMultipart.urldecodeB_urlencodeB_ext"]
test = ["tests/Props.lean::smoke urldecode_urlencode"]

[[requirement]]
id = "urlencoded.string"
upstream = "Starlette FormParser (unquote_plus on str)"
title = "String-level urlencode/urldecode round trip"
status = "tested"
realises = ["LeanMultipart.urlencodeStr", "LeanMultipart.urldecodeStr"]
test = ["tests/Props.lean::tested urlencodeStr/urldecodeStr"]
note = "Byte-level round trip is proved; the String lift needs an ASCII UTF-8 lemma core lacks."

[[requirement]]
id = "qs.ampersand"
upstream = "tests/test_multipart.py::TestQuerystringParser::test_multiple_querystring"
title = "Fields separated by &"
status = "implemented"
realises = ["LeanMultipart.Qs.step"]
theorem = ["LeanMultipart.Qs.parse_total"]
test = ["tests/Conformance.lean::querystring multiple"]

[[requirement]]
id = "qs.semicolon-is-data"
