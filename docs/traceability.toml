title = "max_size < 1 rejected"
status = "deviation"
realises = ["LeanMultipart.QsConfig", "LeanMultipart.MultipartConfig"]
test = ["tests/Conformance.lean::max_size below 1 cannot be configured"]
note = "A structure invariant makes the configuration unconstructible instead of raising ValueError."

[[requirement]]
id = "qs.streaming"
upstream = "tests/test_multipart.py::TestQuerystringParser::test_streaming_break"
title = "Streaming QuerystringParser gives the whole-buffer result for every split"
status = "implemented"
